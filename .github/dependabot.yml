version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      non-breaking-changes:
        update-types: [minor, patch]
    ignore:
      # astro check (@astrojs/check) does not support TypeScript 7 yet.
      - dependency-name: typescript
        versions: [">=7"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
